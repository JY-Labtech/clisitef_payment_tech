name: clisitef_payment_tech
description: Flutter plugin for the CliSiTef TEF SDK (Software Express/Fiserv) on Android POS terminals and PIN pads, with credit, debit, PIX and cancellation.
version: 4.0.0
homepage: https://github.com/JY-Labtech/clisitef_payment_tech
repository: https://github.com/JY-Labtech/clisitef_payment_tech
issue_tracker: https://github.com/JY-Labtech/clisitef_payment_tech/issues
topics:
  - payment
  - pos
  - tef
  - android
  - brazil

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: br.com.jylabtech.clisitef_payment_tech
        pluginClass: ClisitefPaymentTechPlugin
