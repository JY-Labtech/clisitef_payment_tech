pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    def localPropertiesFile = new File(settingsDir, "local.properties")
    def localProperties = new Properties()
    assert localPropertiesFile.exists()
    localPropertiesFile.withReader("UTF-8") { localProperties.load(it) }

    def flutterSdkPath = localProperties.getProperty("flutter.sdk")
    assert flutterSdkPath != null && flutterSdkPath.trim(), "flutter.sdk not set in local.properties"

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")
}

plugins {
    id "com.android.application" version "8.13.0" apply false
    id "org.jetbrains.kotlin.android" version "2.2.20" apply false
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
}

include(":app")
