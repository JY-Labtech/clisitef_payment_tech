group 'br.com.jylabtech.clisitef_payment_tech'
version '1.0'

buildscript {
    ext {
        kotlin_version = '1.9.0'

        localProps = new Properties()
        fileName = 'local.properties'
        if (project.rootProject.file(fileName).exists()) {
            localProps.load(new FileInputStream(rootProject.file(fileName)))
        }

        // Licence Keys
        licenceKey = System.env.LICENCE_KEY ?: localProps.getProperty("licenceKey") ?: ""
        licenceInternalKey = System.env.LICENCE_INTERNAL_KEY ?: localProps.getProperty("licenceInternalKey") ?: ""

        if (!licenceKey || licenceKey == "") {
            throw new GradleException("LicenceKey não encontrado!!")
        }

        if (!licenceInternalKey || licenceInternalKey == "") {
            throw new GradleException("LicenceInternalKey não encontrado!!")
        }

        println "licenceKey: $licenceKey"
        println "licenceInternalKey: $licenceInternalKey"
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 31
    buildToolsVersion '28.0.3'

    lintOptions {
        disable 'InvalidPackage'
        checkReleaseBuilds false
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    packagingOptions {
        exclude 'META-INF/api_release.kotlin_module'
        exclude 'META-INF/client_release.kotlin_module'

        doNotStrip "**/libclisitef.so"
        exclude("META-INF/DEPENDENCIES")
        exclude("META-INF/LICENSE")
        exclude("META-INF/LICENSE.txt")
        exclude("META-INF/license.txt")
        exclude("META-INF/NOTICE")
        exclude("META-INF/NOTICE.txt")
        exclude("META-INF/notice.txt")
        exclude("META-INF/ASL2.0")
        exclude("META-INF/*.kotlin_module") 
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 23
        buildConfigField "String", "LICENCE_KEY", "\"${licenceKey}\""
        buildConfigField "String", "LICENCE_INTERNAL_KEY", "\"${licenceInternalKey}\""
    }
}

dependencies {
    // Dependencias para módulo de licença (sem kapt)
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("androidx.security:security-crypto:1.1.0-alpha03")
    
    // Outras libs
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') { transitive = false }
    implementation 'com.google.zxing:core:3.5.1'

    androidTestImplementation 'androidx.test:runner:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'

    // ⚠️ Verifica se o JAR clisitef existe no projeto principal
    def clisitefJar = "${project.rootDir}/android/libs/clisitef.jar"
    if (file(clisitefJar).exists()) {
        implementation files(clisitefJar)
        println "[INFO] clisitef.jar encontrado em: $clisitefJar"
    } else {
        throw new GradleException(
            "\n\n[ERRO] clisitef.jar não encontrado em: $clisitefJar\n" +
            "Adicione o arquivo manualmente no projeto que usa o plugin:\n" +
            "→ android/libs/clisitef.jar\n"
        )
    }
}
