group = "br.com.jylabtech.clisitef_payment_tech"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

def libsDir = file("libs")
if (!libsDir.exists()) {
    libsDir.mkdirs()
}

def nativeJarFiles = fileTree(dir: "libs", include: ["*-native.jar"]).files
if (nativeJarFiles.isEmpty()) {
    throw new GradleException("Nenhum artefato nativo encontrado em android/libs. Execute scripts/build_android_aar.sh para gerar os binários proprietários.")
}

def requiredArtifacts = [
        "clisitef-android-debug.jar",
        "libgedi-1.16.8-gpos700-payment-release.jar",
        "ppcomp_release-1.29.8.200623.jar"
]

requiredArtifacts.each { artifact ->
    def artifactFile = new File(libsDir, artifact)
    if (!artifactFile.exists()) {
        throw new GradleException("Artefato obrigatório não encontrado: ${artifactFile.absolutePath}")
    }
}

android {
    namespace = "br.com.jylabtech.clisitef_payment_tech"
    compileSdk = 34

    defaultConfig {
        minSdk = 23
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*-native.jar"])
    implementation files("libs/clisitef-android-debug.jar")
    implementation files("libs/libgedi-1.16.8-gpos700-payment-release.jar")
    implementation files("libs/ppcomp_release-1.29.8.200623.jar")

    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.activity:activity:1.9.0")
    implementation("androidx.activity:activity-ktx:1.9.0")
    implementation("androidx.constraintlayout:constraintlayout:2.1.4")
    implementation("com.google.android.material:material:1.11.0")
    implementation("com.google.code.gson:gson:2.10.1")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("androidx.security:security-crypto:1.1.0-alpha05")
    implementation("com.journeyapps:zxing-android-embedded:4.3.0") {
        transitive = false
    }
    implementation("com.google.zxing:core:3.5.1")
}

