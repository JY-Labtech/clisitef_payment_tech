plugins {
    id 'com.android.library' version '8.9.1'
}

def flutterSdkPath = System.getenv("FLUTTER_SDK")
if (flutterSdkPath == null || flutterSdkPath.trim().isEmpty()) {
    throw new GradleException("A variável de ambiente FLUTTER_SDK precisa apontar para o diretório do Flutter SDK para compilar o AAR.")
}

def flutterEngineDir = file("${flutterSdkPath}/bin/cache/artifacts/engine")
if (!flutterEngineDir.exists()) {
    throw new GradleException("Não foi encontrado o diretório de artefatos do Flutter em ${flutterEngineDir}. Execute 'flutter precache' e tente novamente.")
}

def flutterJar = null
flutterEngineDir.eachFileRecurse { candidate ->
    if (candidate.name == "flutter.jar" && flutterJar == null) {
        flutterJar = candidate
    }
}

if (flutterJar == null) {
    throw new GradleException("Não foi possível localizar flutter.jar. Execute 'flutter precache' ou informe manualmente o caminho.")
}

def externalLibsDir = file("${rootProject.projectDir.parentFile}/libs")
if (!externalLibsDir.exists()) {
    throw new GradleException("Diretório de bibliotecas externas não encontrado em ${externalLibsDir}. Garanta que os AAR/JAR do fabricante estejam disponíveis em android/libs.")
}

group = "br.com.jylabtech.clisitef_payment_tech"
version = "1.0.0"

repositories {
    google()
    mavenCentral()
}

android {
    namespace "br.com.jylabtech.clisitef_payment_tech"
    compileSdk = 34

    defaultConfig {
        minSdk = 23
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildFeatures {
        buildConfig = false
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    packaging {
        jniLibs {
            keepDebugSymbols += ["**/libclisitef.so"]
        }
        resources {
            excludes += [
                    "META-INF/DEPENDENCIES",
                    "META-INF/LICENSE",
                    "META-INF/LICENSE.txt",
                    "META-INF/license.txt",
                    "META-INF/NOTICE",
                    "META-INF/NOTICE.txt",
                    "META-INF/notice.txt",
                    "META-INF/ASL2.0",
                    "META-INF/*.kotlin_module"
            ]
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

dependencies {
    compileOnly files(flutterJar)

    implementation 'androidx.annotation:annotation:1.8.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') {
        transitive = false
    }
    implementation 'com.google.zxing:core:3.5.1'
    compileOnly fileTree(dir: externalLibsDir, include: ['*.jar'])
    compileOnly fileTree(dir: externalLibsDir, include: ['*.aar'])

    testImplementation 'junit:junit:4.13.2'
    // MethodCall/Result do engine do Flutter nos testes JVM
    testImplementation files(flutterJar)
}

